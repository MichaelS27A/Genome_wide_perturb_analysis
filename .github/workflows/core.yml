name: Python core workflow
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
      - name: Reconstruct the recorded Linux environment
        run: |
          conda create -y -n xatlas --file workflow/envs/locks/linux-64.conda.txt
          conda activate xatlas
          python -m pip install --no-deps -r workflow/envs/locks/pip.txt
          python -m pip check
      - name: Input contracts and real repeated workflow
        run: |
          conda activate xatlas
          export PYTHONNOUSERSITE=1
          python -m unittest discover -s tests -p test_workflow_contracts.py -v
          python tests/run_tiny_workflow.py --outdir examples/tiny
